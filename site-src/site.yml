site:
  name: 嵌入式高级工程师 · 能力地图
  tagline: 576 个技能点，一条从 C 语言到 FOC 的完整路线
  description: 嵌入式高级工程师能力地图与课程：C 语言、MCU 底层、RTOS、通信协议、电机控制，按技能点组织，可检索、可打卡。
  author: Chen
  # 留空时 CI 自动读取 GITHUB_REPOSITORY，本地构建落到占位地址
  repo: ""
  labs_repo: ""
  branch: main
  # 这些笔记只留本地，不发布、也不进公开仓库
  exclude:
    - "2026.10 – 2030.9 四年职业规划.md"
    - "嵌入式职业规划分析.md"

roadmap:
  intro: >-
    这张表不是按章节顺序排的，而是按目标岗位的「硬门槛」排的：先补决定能不能过简历关的五项，
    再补面试会追问的熟练项，其余按时间允许扩展。每一项都对应能力地图里的编号，点进去就是课。
  tiers:
    - key: p0
      short: P0 · 精通档
      title: 第一优先级 · 精通档（决定门槛的五项）
      desc: 内存池 / volatile / 寄存器映射 / 用 C 实现 OOP / 链接脚本；NVIC、异常、MPU、启动代码、DSP、FPU；RTOS 任务与同步；CAN + EtherCAT；FOC、SVPWM、编码器、PID。
      points:
        - "1.2.3"
        - "1.6.1"
        - "1.6.4"
        - "1.7"
        - "1.8.2"
        - "3.1.2"
        - "3.1.4"
        - "3.1.5"
        - "3.1.7"
        - "3.1.9"
        - "3.1.10"
        - "4.1"
        - "4.2"
        - "4.3"
        - "8.1.1"
        - "8.1.2"
        - "8.1.3"
        - "8.1.9"
        - "9.1.3"
        - "9.1.4"
        - "9.1.5"
        - "9.1.6"
    - key: p1
      short: P1 · 熟练档
      title: 第二优先级 · 熟练档（面试会追问）
      desc: 嵌入式 C++ 子集、Linux 驱动与设备树、分层架构与状态机、原理图与仪器使用——这些不单独开战场，尽量嵌在项目里做。
      points:
        - "2.1.1"
        - "2.1.2"
        - "2.1.3"
        - "2.1.4"
        - "2.2"
        - "2.3"
        - "5.2"
        - "5.3"
        - "6.1"
        - "6.2"
        - "6.3"
        - "6.5"
        - "3.10.1"
        - "3.10.6"
        - "3.10.7"
        - "3.10.8"
    - key: p2
      short: P2 · 了解档
      title: 第三优先级 · 了解档
      desc: 功能安全与信息安全是 2030 年的溢价点，但先到「读得懂标准、能对话」即可；工程化补 HIL、覆盖率、MISRA。
      points:
        - "10.1"
        - "10.2"
        - "7.1"
        - "7.3"
        - "7.6"
        - "7.7"
        - "9.2"
        - "11.1"
    - key: p3
      short: P3 · 暂缓
      title: 暂不投入
      desc: 边缘 AI、音视频、软技能中的通用项：与目标岗位正交，等主线跑通再回来看。
      points:
        - "13.1"
        - "13.2"
        - "13.3"
        - "9.7"
        - "12.1"
  quarters:
    - q: 2026 Q4
      focus: 有感 FOC 闭环 + C++ 边做边重构
      output: 电流环阶跃波形、带宽实测、一篇调参踩坑笔记
    - q: 2027 Q1
      focus: 无感 FOC（SMO + I/F 启动）+ MCU 底层
      output: 0–3000 rpm 波形、启动文件分析、低速转矩脉动数据
    - q: 2027 Q2
      focus: EtherCAT 从站 + CiA402 + RTOS 实时性测量
      output: DC 同步抖动 < 1 µs、CiA402 状态机跑通、抖动直方图
    - q: 2027 Q3
      focus: ros2_control 打通（保留两条路）或并网逆变器（二选一）
      output: 上位机轨迹控制 demo、1 kHz 循环抖动数据
    - q: 2027 Q3 补充
      focus: Secure Boot / TF-M（STM32U5）
      output: 启动时间开销数据、一篇安全启动笔记
    - q: 2027.9 – 2028.6
      focus: 论文期，只维护不新建
      output: 保持每周 2 小时复习，站点与仓库不推新功能
    - q: 2028 Q4 – 2029 Q3
      focus: Linux 驱动 + 新岗位主业 + 功能安全入门
      output: 字符设备驱动、设备树、TÜV 功能安全培训
    - q: 2029 Q4 – 2030 Q3
      focus: 面试八股 + 项目包装 + 投递
      output: 十个高频问题的「实测数据版」答案
